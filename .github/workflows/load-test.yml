name: Run Server Load Test (Cloud)

on:
  workflow_dispatch:
    inputs:
      users:
        description: 'Total requests / virtual users to run (starts at 1000, max 40000)'
        required: true
        default: '1000'
      ramp_rate:
        description: 'Dispatch speed in requests per second (1000 = 1k req/s)'
        required: true
        default: '1000'
      batch_size:
        description: 'Simultaneous sockets per wave (1000 keeps 909 MB EC2 RAM safe during 40k runs)'
        required: true
        default: '1000'
      hold_seconds:
        description: 'Seconds to hold connections live (for single-wave inspection)'
        required: true
        default: '15'
      test_calls:
        description: 'Also simulate paired video call signaling + ephemeral chat?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      target_url:
        description: 'ZingTalk Server URL'
        required: true
        default: 'https://zingtalk.duckdns.org'

jobs:
  load-test:
    name: Simulate ZingTalk Guests & Calls (1k - 40k)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Socket.IO Client
        run: npm install --no-audit --no-fund socket.io-client

      - name: Run Cloud Load Test
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          LOAD_USERS: ${{ github.event.inputs.users }}
          RAMP_RATE: ${{ github.event.inputs.ramp_rate }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size }}
          HOLD_SECONDS: ${{ github.event.inputs.hold_seconds }}
          TEST_CALLS: ${{ github.event.inputs.test_calls }}
          LOAD_TEST_SECRET: ${{ secrets.LOAD_TEST_TOKEN }}
        run: node scripts/load-test.js
