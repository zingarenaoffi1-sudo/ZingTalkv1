name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'server.js'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploying code to AWS EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          script_stop: false
          script: |
            echo "=== [1/4] Finding ZingTalk Server Directory ==="
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$PATH:$HOME/.npm-global/bin:$HOME/.nvm/versions/node/$(node -v 2>/dev/null)/bin:/usr/local/bin:/usr/bin:/home/ubuntu/.nvm/versions/node/$(node -v 2>/dev/null)/bin"

            PROJECT_DIR=""
            POSSIBLE_DIRS=(
              "${{ secrets.TARGET_DIR }}"
              "/home/ubuntu/ZingTalk"
              "$HOME/ZingTalk"
              "/home/ec2-user/ZingTalk"
              "$(pwd)"
            )

            for dir in "${POSSIBLE_DIRS[@]}"; do
              if [ -n "$dir" ] && [ -d "$dir" ] && [ -f "$dir/server.js" ]; then
                PROJECT_DIR="$dir"
                echo "Found ZingTalk directory at: $PROJECT_DIR"
                break
              fi
            done

            if [ -z "$PROJECT_DIR" ]; then
              PROJECT_DIR="/home/ubuntu/ZingTalk"
              mkdir -p "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR" || exit 1
            echo "Working directory: $(pwd)"

            echo "=== [2/4] Updating Server Backend Files (Preserving Existing Files) ==="
            [ -f "Firebase_Admin_SDK" ] && cp -p "Firebase_Admin_SDK" "/tmp/Firebase_Admin_SDK.bak" 2>/dev/null || true
            [ -f "ssl_proxy.js" ] && cp -p "ssl_proxy.js" "/tmp/ssl_proxy.js.bak" 2>/dev/null || true

            if [ -d ".git" ]; then
              git fetch origin main || true
              git checkout origin/main -- server.js package.json package-lock.json 2>/dev/null || git pull origin main || true
            else
              curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/server.js" -o server.js.tmp && mv server.js.tmp server.js || true
              curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/package.json" -o package.json.tmp && mv package.json.tmp package.json || true
            fi

            [ -f "/tmp/Firebase_Admin_SDK.bak" ] && cp -p "/tmp/Firebase_Admin_SDK.bak" "Firebase_Admin_SDK" 2>/dev/null || true
            [ -f "/tmp/ssl_proxy.js.bak" ] && cp -p "/tmp/ssl_proxy.js.bak" "ssl_proxy.js" 2>/dev/null || true

            # Ensure ONLY server files exist on EC2 (Remove extraneous client build/monorepo folders)
            rm -rf packages android assets scripts *.keystore *.md index.html app.js style.css capacitor* build-dist.js 2>/dev/null || true

            echo "=== [3/4] Installing Production Dependencies ==="
            npm install --production --no-audit --no-fund || true

            echo "=== [4/4] Starting / Reloading PM2 Service ==="
            if command -v pm2 &> /dev/null; then
              if pm2 describe zingtalk > /dev/null 2>&1; then
                pm2 reload zingtalk --update-env || pm2 restart zingtalk --update-env
              elif pm2 describe server > /dev/null 2>&1; then
                pm2 reload server --update-env || pm2 restart server --update-env
              elif pm2 describe server.js > /dev/null 2>&1; then
                pm2 reload server.js --update-env || pm2 restart server.js --update-env
              else
                pm2 start server.js --name "zingtalk"
              fi
              pm2 save || true
              pm2 status
            else
              npx pm2 reload zingtalk --update-env || npx pm2 start server.js --name "zingtalk" || true
            fi

            echo "ZingTalk Server update completed successfully!"
