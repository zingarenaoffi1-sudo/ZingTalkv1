name: Build Connector APK (ZingTalk Connector)

on:
  push:
    paths:
      - 'packages/connector/**'
      - 'scripts/**'
      - 'android/**'
      - 'build-dist.js'
      - '.github/workflows/build-connector.yml'
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-connector-apk:
    name: Build Signed ZingTalk Connector APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Prepare Connector Assets
        run: |
          npm install --no-audit --prefer-offline --legacy-peer-deps
          npm run build
          rm -rf dist/*
          cp -r packages/connector/* dist/ 2>/dev/null || true
          cp -r packages/connector/dist/* dist/ 2>/dev/null || true

      - name: Configure Capacitor for Connector & Add Android Platform
        run: |
          if [ -f "packages/connector/capacitor.config.json" ]; then
            cp packages/connector/capacitor.config.json capacitor.config.json
          fi
          if [ ! -f "android/build.gradle" ]; then
            rm -rf android
            npx cap add android
          fi
          mkdir -p android/app
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi
          npx cap sync android
          mkdir -p android/app/src/main/assets/public
          cp -r packages/connector/* android/app/src/main/assets/public/ 2>/dev/null || true

      - name: Inject Connector Brand Icons
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            res_dir="android/app/src/main/res/mipmap-${d}"
            mkdir -p "$res_dir"
            if [ -f "packages/connector/assets/mipmap-${d}/ic_launcher.png" ]; then
              cp "packages/connector/assets/mipmap-${d}/ic_launcher.png" "$res_dir/ic_launcher.png"
              cp "packages/connector/assets/mipmap-${d}/ic_launcher_round.png" "$res_dir/ic_launcher_round.png"
              cp "packages/connector/assets/mipmap-${d}/ic_launcher_foreground.png" "$res_dir/ic_launcher_foreground.png"
            elif [ -f "assets/mipmap-${d}/ic_launcher.png" ]; then
              cp "assets/mipmap-${d}/ic_launcher.png" "$res_dir/ic_launcher.png"
              cp "assets/mipmap-${d}/ic_launcher_round.png" "$res_dir/ic_launcher_round.png"
              cp "assets/mipmap-${d}/ic_launcher_foreground.png" "$res_dir/ic_launcher_foreground.png"
            fi
          done

      - name: Inject google-services.json & Connector Keystore
        run: |
          mkdir -p android/app
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi
          if [ -f "zingtalk-connector-release.keystore" ]; then
            cp zingtalk-connector-release.keystore android/app/zingtalk-connector-release.keystore
          elif [ ! -f "android/app/zingtalk-connector-release.keystore" ]; then
            keytool -genkeypair -v -keystore android/app/zingtalk-connector-release.keystore \
              -alias zingtalk-connector -keyalg RSA -keysize 2048 -validity 25550 \
              -storepass zingtalk123456 -keypass zingtalk123456 \
              -dname "CN=ZingTalk Connector, OU=Mobile, O=ZingTalk, L=Delhi, ST=Delhi, C=IN"
          fi

      - name: Configure Android Project for Connector
        run: node scripts/prepare-android.js connector

      - name: Build Official Signed Connector APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          APK_FILE=$(find app/build/outputs/apk/release -name "*release*.apk" ! -name "*-unsigned.apk" -type f 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: Signed Release APK was not generated!"
            exit 1
          fi
          cp "$APK_FILE" ../ZingTalk-Connector.apk

      - name: Upload Official ZingTalk Connector APK
        uses: actions/upload-artifact@v4
        with:
          name: ZingTalk-Connector-Release-APK
          path: ZingTalk-Connector.apk
          if-no-files-found: error
