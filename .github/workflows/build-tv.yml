name: Build Fire TV APK (ZingTalk TV)

on:
  push:
    paths:
      - 'packages/tv/**'
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'scripts/**'
      - '.github/workflows/build-tv.yml'
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-tv-apk:
    name: Build Signed ZingTalk Fire TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build Web Assets
        run: |
          npm install
          npm install --save @capacitor/core @capacitor/cli @capacitor/android @capacitor-firebase/authentication
          npm run build

      - name: Configure Capacitor & Add Android Platform
        run: |
          if [ -f "packages/tv/capacitor.config.json" ]; then
            cp packages/tv/capacitor.config.json capacitor.config.json
          fi
          if [ ! -f "android/build.gradle" ]; then
            rm -rf android
            npx cap add android
          fi
          mkdir -p android/app
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi
          npx cap sync android

      - name: Inject Fire TV Icons & Leanback Banner
        run: |
          mkdir -p android/app/src/main/res/drawable
          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png android/app/src/main/res/drawable/banner.png
          fi
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            res_dir="android/app/src/main/res/mipmap-${d}"
            mkdir -p "$res_dir"
            if [ -f "assets/mipmap-${d}/ic_launcher.png" ]; then
              cp "assets/mipmap-${d}/ic_launcher.png" "$res_dir/ic_launcher.png"
              cp "assets/mipmap-${d}/ic_launcher_round.png" "$res_dir/ic_launcher_round.png"
              cp "assets/mipmap-${d}/ic_launcher_foreground.png" "$res_dir/ic_launcher_foreground.png"
            fi
          done

      - name: Inject google-services.json & TV Keystore
        run: |
          mkdir -p android/app
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi
          if [ -f "zingtalk-tv-release.keystore" ]; then
            cp zingtalk-tv-release.keystore android/app/zingtalk-tv-release.keystore
          else
            keytool -genkeypair -v -keystore android/app/zingtalk-tv-release.keystore \
              -alias zingtalk-tv -keyalg RSA -keysize 2048 -validity 25550 \
              -storepass zingtalk123456 -keypass zingtalk123456 \
              -dname "CN=ZingTalk TV, OU=FireTV, O=ZingTalk, L=Delhi, ST=Delhi, C=IN"
          fi

      - name: Configure Android Project for TV
        run: node scripts/prepare-android.js tv

      - name: Build Official Signed Fire TV APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
          APK_FILE=$(find app/build/outputs/apk/release -name "*release*.apk" ! -name "*-unsigned.apk" -type f 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          fi
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" ../ZingTalk-FireTV.apk
          fi

      - name: Upload Official ZingTalk Fire TV APK
        uses: actions/upload-artifact@v4
        with:
          name: ZingTalk-FireTV-Release-APK
          path: ZingTalk-FireTV.apk
          if-no-files-found: error
