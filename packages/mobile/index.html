<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZingTalk Mobile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="../../assets/favicon.png">
    <script src="../../capacitor.js"></script>
    <script src="../../socket.io.min.js"></script>
</head>
<body class="mobile-body">

    <div id="mobile-app-root">

        <!-- Mobile Header -->
        <header id="mobile-header" class="mobile-header">
            <div class="mobile-header-brand">
                <img src="../../assets/icon.png" alt="ZingTalk" class="mobile-brand-logo">
                <span class="mobile-brand-name">ZingTalk</span>
            </div>
            <div class="mobile-header-actions">
                <div id="mobile-my-uid-pill" class="mobile-uid-badge">UID: Connecting...</div>
                <button type="button" id="mobile-logout-btn" class="mobile-icon-btn" title="Sign Out">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                </button>
            </div>
        </header>

        <!-- View 1: Contacts & Chats (Default) -->
        <main id="view-contacts" class="mobile-view">
            <div class="contacts-header">
                <h2 class="section-title">Saved Contacts</h2>
                <button type="button" id="open-add-contact-btn" class="mobile-add-btn">+ Add Contact</button>
            </div>
            <div id="mobile-contacts-list" class="contacts-list">
                <!-- Contacts rendered dynamically -->
            </div>
        </main>

        <!-- View 2: Dialpad -->
        <main id="view-dialpad" class="mobile-view hidden">
            <div class="dialpad-container">
                <input type="text" id="mobile-dial-input" class="dialpad-display" placeholder="Enter 10-Digit UID" maxlength="10" readonly>
                <div class="dialpad-grid">
                    <button type="button" class="dial-btn" data-key="1">1</button>
                    <button type="button" class="dial-btn" data-key="2">2</button>
                    <button type="button" class="dial-btn" data-key="3">3</button>
                    <button type="button" class="dial-btn" data-key="4">4</button>
                    <button type="button" class="dial-btn" data-key="5">5</button>
                    <button type="button" class="dial-btn" data-key="6">6</button>
                    <button type="button" class="dial-btn" data-key="7">7</button>
                    <button type="button" class="dial-btn" data-key="8">8</button>
                    <button type="button" class="dial-btn" data-key="9">9</button>
                    <button type="button" class="dial-btn" data-key="C">C</button>
                    <button type="button" class="dial-btn" data-key="0">0</button>
                    <button type="button" class="dial-btn" data-key="⌫">⌫</button>
                </div>
                <div class="dialpad-actions">
                    <button type="button" id="mobile-dial-video-btn" class="dial-call-btn video">
                        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                        <span>Video Call</span>
                    </button>
                    <button type="button" id="mobile-dial-audio-btn" class="dial-call-btn audio">
                        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/></svg>
                        <span>Audio Call</span>
                    </button>
                </div>
            </div>
        </main>

        <!-- View 3: Profile & Settings -->
        <main id="view-profile" class="mobile-view hidden">
            <div class="contacts-header">
                <h2 class="section-title">My Profile</h2>
            </div>
            <div class="contact-card" style="margin-top: 10px;">
                <div id="profile-avatar" class="contact-avatar">U</div>
                <div class="contact-info">
                    <div id="profile-name" class="contact-name">User Name</div>
                    <div id="profile-email" class="contact-uid">user@domain.com</div>
                    <div id="profile-uid-full" class="contact-uid" style="color: var(--accent-cyan); font-weight: 700; margin-top: 4px;">UID: ----------</div>
                </div>
            </div>
            <button type="button" id="copy-my-uid-btn" class="auth-submit-btn" style="margin-top: 16px;">
                📋 Copy My 10-Digit UID
            </button>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="mobile-bottom-nav">
            <button type="button" class="mobile-nav-item active" data-view="view-contacts">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                <span>Contacts</span>
            </button>
            <button type="button" class="mobile-nav-item" data-view="view-dialpad">
                <svg viewBox="0 0 24 24"><path d="M12 19c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM6 1c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12-8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-6 8c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                <span>Dialpad</span>
            </button>
            <button type="button" class="mobile-nav-item" data-view="view-profile">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span>Profile</span>
            </button>
        </nav>

        <!-- Chat Overlay / Drawer -->
        <div id="mobile-chat-screen" class="mobile-chat-screen hidden">
            <header class="chat-header">
                <button type="button" id="close-chat-btn" class="mobile-icon-btn">
                    <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </button>
                <div class="chat-header-info">
                    <div id="chat-contact-name" class="chat-header-name">Contact</div>
                    <div id="chat-contact-uid" class="chat-header-uid">UID: ----------</div>
                </div>
                <button type="button" id="chat-audio-btn" class="action-icon-btn call-audio">
                    <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/></svg>
                </button>
                <button type="button" id="chat-video-btn" class="action-icon-btn call-video">
                    <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                </button>
            </header>
            <div id="mobile-chat-messages" class="chat-messages"></div>
            <div class="chat-input-row">
                <input type="text" id="mobile-chat-input" class="chat-input" placeholder="Type a message..." autocomplete="off">
                <button type="button" id="mobile-chat-send-btn" class="chat-send-btn">
                    <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>

        <!-- Fullscreen Call Screen -->
        <div id="mobile-call-screen" class="mobile-call-screen hidden">
            <div class="call-video-container">
                <video id="remote-video" class="remote-video" autoplay playsinline></video>
                <video id="local-video" class="local-video" autoplay playsinline muted></video>
                <div class="call-meta-bar">
                    <span id="call-target-display">UID: ----------</span> • <span id="call-duration-timer">00:00</span>
                </div>
            </div>
            <div class="call-controls-row">
                <!-- Camera Switch Button (Flip Front / Back Camera) -->
                <button type="button" id="flip-camera-btn" class="call-ctl-btn" title="Switch Camera">
                    <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M9 12c0 1.66 1.34 3 3 3s3-1.34 3-3-1.34-3-3-3-3 1.34-3 3zm11-4h-3.17L15 6H9L7.17 8H4c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-8 10c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
                </button>
                <button type="button" id="mute-mic-btn" class="call-ctl-btn" title="Mute Microphone">
                    <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
                </button>
                <button type="button" id="toggle-video-btn" class="call-ctl-btn" title="Toggle Camera">
                    <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                </button>
                <button type="button" id="end-call-btn" class="call-ctl-btn end-call" title="End Call">
                    <svg width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
                </button>
            </div>
        </div>

        <!-- Add Contact Modal -->
        <div id="add-contact-modal" class="mobile-modal-overlay hidden">
            <div class="mobile-modal-card">
                <h3 class="mobile-modal-title">Add New Contact</h3>
                <div class="auth-input-group">
                    <label class="auth-label" for="new-contact-name">Name</label>
                    <input type="text" id="new-contact-name" class="auth-input" placeholder="e.g. Rahul Sharma">
                </div>
                <div class="auth-input-group">
                    <label class="auth-label" for="new-contact-uid">10-Digit UID</label>
                    <input type="tel" id="new-contact-uid" class="auth-input" placeholder="e.g. 2156774755" maxlength="10">
                </div>
                <button type="button" id="save-new-contact-btn" class="auth-submit-btn">Save Contact</button>
                <button type="button" id="cancel-contact-btn" class="auth-guest-btn">Cancel</button>
            </div>
        </div>

        <!-- Authentication Screen -->
        <div id="mobile-auth-screen" class="mobile-auth-screen">
            <div class="auth-header">
                <img src="../../assets/icon.png" alt="ZingTalk" class="auth-logo">
                <h1 class="auth-title">ZingTalk</h1>
                <p class="auth-subtitle">Private P2P HD Calling & Ephemeral Messaging</p>
            </div>
            <div class="auth-form">
                <div id="mobile-auth-name-group" class="auth-input-group hidden">
                    <label class="auth-label" for="mobile-auth-name">Your Full Name</label>
                    <input type="text" id="mobile-auth-name" class="auth-input" placeholder="e.g. Sunny">
                </div>
                <div class="auth-input-group">
                    <label class="auth-label" for="mobile-auth-email">Email Address</label>
                    <input type="email" id="mobile-auth-email" class="auth-input" placeholder="user@domain.com">
                </div>
                <div class="auth-input-group">
                    <label class="auth-label" for="mobile-auth-pass">Password</label>
                    <input type="password" id="mobile-auth-pass" class="auth-input" placeholder="••••••••">
                </div>
                <button type="button" id="mobile-auth-submit-btn" class="auth-submit-btn">Sign In</button>
                <button type="button" id="mobile-guest-btn" class="auth-guest-btn">Instant Guest Login</button>
                <div class="auth-switch-text">
                    <span id="mobile-auth-toggle-label">Don't have an account?</span>
                    <button type="button" id="mobile-auth-toggle-btn" class="auth-switch-btn">Sign Up</button>
                </div>
            </div>
        </div>

        <!-- Toast Feedback -->
        <div id="mobile-toast" class="mobile-toast"></div>

    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
